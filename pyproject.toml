[project]
name = "road-watch"
version = "0.1.0"
description = "Dashcam traffic-violation evidence for Hyderabad: detection, plate checks, sealed evidence, anonymous hotspots"
readme = "README.md"
authors = [
    { name = "pRashAnth", email = "kprsnt@live.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
detect = [
    "numpy>=2.5.4",
    "onnxruntime>=1.32.0",
    "opencv-python-headless>=5.0.0.93",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
